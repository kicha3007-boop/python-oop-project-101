[project]
name = "hexlet-code"
version = "0.1.0"
description = "Data validation library with a fluent interface"
authors = [{ name = "Kichigin Sergey" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["validator"]

[tool.coverage.report]
fail_under = 95
